# HomeOps: дашборд и сервис стендов; имя проекта одинаковое на Mac и Windows
name: homeops

services:
  dashboard:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: homeops-dashboard:latest
    container_name: homeops-dashboard
    ports:
      # Только localhost: через дашборд можно управлять стендами в Docker
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    environment:
      DATA_DIR_LABEL: ${DASHBOARD_DATA:-./data}
      LABS_URL: http://labs:8090
    volumes:
      # По умолчанию — папка ./data проекта: тот же файл, что и в `npm run dev`.
      # Named volume вместо папки: DASHBOARD_DATA=homeops-data docker compose up -d
      - ${DASHBOARD_DATA:-./data}:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Сервис стендов инцидентов: запускает incidents/<id> из дашборда (кнопки, логи, терминал).
  # Доступ к сокету Docker = права администратора Docker, поэтому сервис выполняет только
  # фиксированные действия над incidents/* и принимает запросы только с этой машины.
  labs:
    build:
      context: .
      target: labs
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: homeops-labs:latest
    container_name: homeops-labs
    environment:
      DASHBOARD_URL_INTERNAL: http://dashboard:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./incidents:/workspace/incidents
    ports:
      # для npm run dev (прокси Vite); production-дашборд ходит по внутренней сети
      - "127.0.0.1:8091:8090"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Автопрогон разработчика: свой кластер, копии стендов, отчёты без отправки в дашборд.
  # docker compose --profile tools run --rm --build incident-regression
  incident-regression:
    profiles: [tools]
    image: homeops-labs:latest
    build:
      context: .
      target: labs
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    entrypoint: ["node", "/runner/incident-regression.ts"]
    command: []
    init: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/runner:ro
      - ./incidents:/source/incidents:ro
      - ./regression-runs:/runs
    environment:
      SOURCE_INCIDENTS: /source/incidents
      REGRESSION_OUTPUT: /runs
    security_opt:
      - no-new-privileges:true

volumes:
  homeops-data:
