# Общий шаблон для sentinel-1..3. При первом старте копируется в рабочий файл контейнера:
# Sentinel сам дописывает в него найденные реплики, других Sentinel и смену мастера.
port 26379
dir /tmp
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor orders redis-1 6379 2
sentinel down-after-milliseconds orders 5000
sentinel failover-timeout orders 20000
sentinel parallel-syncs orders 1
