# Маршрут команды API заказов: первый сервис, который переезжает на Gateway API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: market-api
spec:
  parentRefs:
    - name: edge
      namespace: gw-system
      sectionName: http
  hostnames: [api.market.example.test]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /orders }
      backendRefs:
        - name: orders-api
          port: 8080
