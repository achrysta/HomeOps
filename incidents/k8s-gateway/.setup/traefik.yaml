# Входной контроллер кластера: Traefik обслуживает и Ingress (IngressClass traefik), и Gateway API (GatewayClass traefik).
# Инфраструктура стенда — не для правки: поломки в manifests/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: gw-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homeops-gw-traefik
rules:
  - apiGroups: [""]
    resources: [services, secrets, configmaps, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, grpcroutes, tcproutes, tlsroutes, udproutes, referencegrants, backendtlspolicies, listenersets]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status, gateways/status, httproutes/status, grpcroutes/status, tcproutes/status, tlsroutes/status, udproutes/status, backendtlspolicies/status, listenersets/status]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homeops-gw-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homeops-gw-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: gw-system
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: gw-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.7.14
          args:
            - --entrypoints.web.address=:8000
            - --entrypoints.traefik.address=:9000
            - --ping=true
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            - --providers.kubernetesgateway=true
            - --log.level=INFO
          ports:
            - { name: web, containerPort: 8000 }
            - { name: admin, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /ping, port: admin }
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 160Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: gw-system
spec:
  type: NodePort
  selector: { app: traefik }
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30890
