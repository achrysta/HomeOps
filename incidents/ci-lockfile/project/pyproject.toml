[project]
name = "release-notes"
version = "1.4.0"
description = "Заметки о релизах из git-тегов сервисов: порядок версий, последний релиз"
requires-python = ">=3.12"
dependencies = [
    # 9 октября: переход на актуальный packaging — ветка 21.x больше не поддерживается (задача PLAT-1182)
    "packaging>=24.2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
