# Инцидент «Оформление заказов не видит биллинг». Учебный сервер с systemd и сервис биллинга рядом.
#   docker compose up -d --build        — поднять сервер и биллинг
#   docker compose exec server bash -l  — войти на сервер (внутри: verify — автопроверка)
#   docker compose up -d --force-recreate — начать заново (свежая поломка)
#   docker compose down                 — остановить
name: inc-linux-dns

services:
  server:
    image: homeops-linux-server:1
    build: ../_shared/linux-server
    hostname: shop-01
    labels:
      homeops.role: server
    # systemd внутри контейнера: права на cgroup вместо полного --privileged
    cap_add: [SYS_ADMIN]
    security_opt: [seccomp=unconfined, apparmor=unconfined]
    cgroup: private
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - ./setup:/usr/local/lib/homeops/incident:ro
      - ../_tools:/opt/homeops/tools:ro
      - ./checks.py:/opt/homeops/checks.py:ro
      - ./.reports:/opt/homeops/reports
    environment:
      INCIDENT_ID: linux-dns
      DASHBOARD_URL: ${DASHBOARD_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - host.docker.internal:host-gateway

  # Биллинг переехал: теперь он за именем billing.internal во внутреннем DNS (Docker DNS сети стенда)
  billing:
    image: python:3.12-alpine
    command: ["python", "-c", "import http.server as h\nclass H(h.BaseHTTPRequestHandler):\n def do_GET(s):\n  s.send_response(200); s.end_headers(); s.wfile.write(b'billing: ok')\n def log_message(s,*a): pass\nh.ThreadingHTTPServer(('',8080),H).serve_forever()"]
    networks:
      default:
        aliases: [billing.internal]
