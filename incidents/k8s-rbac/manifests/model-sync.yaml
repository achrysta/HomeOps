# Агент выкатки: читает желаемую версию из ConfigMap model-version
# и обновляет Deployment model-server. Права — только на это.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-sync
  namespace: models
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-sync
  namespace: models
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-sync
  namespace: models
subjects:
  - kind: ServiceAccount
    name: model-sync
    namespace: models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-sync
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-sync
  namespace: models
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-sync
  template:
    metadata:
      labels:
        app: model-sync
    spec:
      containers:
        - name: sync
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: sync-app
