# Сервис счетов: 2 реплики на рабочем узле, пишет в лог строку о готовности
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoices
  namespace: billing
spec:
  replicas: 2
  selector:
    matchLabels: { app: invoices }
  template:
    metadata:
      labels: { app: invoices }
    spec:
      containers:
        - name: invoices
          image: python:3.12-alpine
          command: ["sh", "-c", "echo 'invoices: ready to issue invoices'; exec python -m http.server 8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 3
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
