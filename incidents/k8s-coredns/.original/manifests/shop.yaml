# База (упрощённая: принимает TCP-соединения на 5432) и сервис заказов, который ходит в неё по имени db
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: db
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              import socket
              s = socket.socket()
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(("", 5432))
              s.listen(16)
              print("db: listening on 5432", flush=True)
              while True:
                  c, _ = s.accept()
                  c.close()
          ports:
            - containerPort: 5432
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: shop
spec:
  selector: { app: db }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      # «Ускорили DNS»: резолвер узла вместо DNS кластера
      dnsPolicy: Default
      containers:
        - name: orders
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              import http.server, socket
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      try:
                          socket.create_connection(("db", 5432), timeout=2).close()
                          code, body = 200, b"orders: ok, db reachable\n"
                      except OSError as e:
                          code, body = 503, f"orders: db unavailable: {e}\n".encode()
                      self.send_response(code)
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              print("orders: listening on 8080", flush=True)
              http.server.ThreadingHTTPServer(("", 8080), H).serve_forever()
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shop
spec:
  selector: { app: orders }
  ports:
    - port: 80
      targetPort: 8080
