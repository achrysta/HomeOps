# Ingress для внутреннего LLM API.
# Конфиг собран по шаблону для наших REST-сервисов (orders-api, catalog-api).

log_format llm '$remote_addr "$request" $status $body_bytes_sent '
               'rt=$request_time urt=$upstream_response_time uht=$upstream_header_time';

upstream llm_backend {
    server llm:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log llm;

    client_max_body_size 2m;

    location = /health {
        proxy_pass http://llm_backend/health;
    }

    location /v1/ {
        proxy_pass http://llm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 5s;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
