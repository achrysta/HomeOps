# Развёртывание оператора (платформа). Права — в manifests/operator-rbac.yaml, настройки — в manifests/operator-config.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-operator
  namespace: ops-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-operator
  namespace: ops-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: backup-operator }
  template:
    metadata:
      labels: { app: backup-operator }
    spec:
      serviceAccountName: backup-operator
      terminationGracePeriodSeconds: 2
      containers:
        - name: operator
          image: python:3.12-alpine
          command: ["python", "-u", "/app/backup_operator.py"]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: config, mountPath: /etc/backup-operator }
      volumes:
        - name: app
          configMap: { name: backup-operator-app }
        - name: config
          configMap: { name: backup-operator }
