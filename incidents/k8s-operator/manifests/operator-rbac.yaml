# Права оператора резервного копирования: читать Backup во всех namespace, писать их статус, управлять CronJob
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-operator
rules:
  - apiGroups: [ops.example.test]
    resources: [backups]
    verbs: [get, list, watch]
  - apiGroups: [ops.example.test]
    resources: [backups/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [cronjobs]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-operator
subjects:
  - kind: ServiceAccount
    name: backup-operator
    namespace: ops-system
