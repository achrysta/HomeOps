# Витрина магазина по HTTPS
server {
    listen 443 ssl;
    server_name shop.example.test www.shop.example.test;
    ssl_certificate     /etc/nginx/tls/shop.crt;
    ssl_certificate_key /etc/nginx/tls/shop.key;
    root /var/www/shop;
    index index.html;
}

server {
    listen 80;
    server_name shop.example.test www.shop.example.test;
    return 301 https://$host$request_uri;
}
