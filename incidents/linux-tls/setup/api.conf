# API заказов для партнёров
server {
    listen 443 ssl;
    server_name api.shop.example.test;
    ssl_certificate     /etc/nginx/tls/shop.crt;
    ssl_certificate_key /etc/nginx/tls/shop.key;
    default_type application/json;
    location /orders { return 200 '{"orders": [{"id": 48213, "status": "paid"}, {"id": 48214, "status": "new"}]}'; }
    location / { return 404 '{"error": "not found"}'; }
}
