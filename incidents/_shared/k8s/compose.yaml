# Общий кластер Kubernetes-стендов (kind: control-plane + worker). Обычно им управляет дашборд;
# вручную из этой папки:
#   docker compose run --rm cluster up    — создать кластер (первый раз 1–3 минуты)
#   docker compose run --rm cluster down  — удалить кластер и освободить память
#   docker compose run --rm cluster prepare <стенд> — поломка в узлах для стенда уровня кластера
name: homeops-k8s

services:
  # Служебный сервис: только он видит сокет Docker — kind создаёт узлы как контейнеры
  cluster:
    image: homeops-k8s-tools:1
    build: ./tools
    profiles: [tools]
    entrypoint: ["homeops-cluster"]
    command: ["up"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/k8s:ro
      # скрипты подготовки узлов стендов уровня кластера (homeops-cluster prepare <стенд>)
      - ../../:/incidents:ro
      - kubeconfig:/kube

volumes:
  kubeconfig:
    name: homeops-k8s-kubeconfig
