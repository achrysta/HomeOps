# Поиск по каталогу: к распродаже ждём рост трафика в разы
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      containers:
        - name: search
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: search-app
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
spec:
  selector:
    app: search-api
  ports:
    - port: 80
      targetPort: 8080
