# Инцидент «InferenceService модели оттока не поднимается».
# Стенд уровня кластера в кластере kind (../_shared/k8s): ставит cert-manager и KServe (объекты уровня кластера)
# и размечает рабочий узел как пул serving, поэтому работает один на свежем кластере. Из этой папки:
#   docker compose -f ../_shared/k8s/compose.yaml run --rm cluster down  — убрать старый кластер (стенду нужен свежий)
#   docker compose -f ../_shared/k8s/compose.yaml run --rm cluster up    — свежий кластер
#   docker compose -f ../_shared/k8s/compose.yaml run --rm cluster prepare kserve-isvc  — образы KServe в узлах и пул serving
#   docker compose up -d --wait            — подготовить стенд в кластере (cert-manager, KServe, модель)
#   docker compose exec kubectl bash -l    — терминал с kubectl
#   docker compose run --rm verify         — автопроверка, отчёт уйдёт в дашборд
#   сброс — заново: cluster down, cluster up, cluster prepare, up -d --wait --force-recreate
#   docker compose down и cluster down     — остановить стенд и удалить кластер
name: inc-kserve-isvc

x-k8s: &k8s
  image: homeops-k8s-tools:1
  build: ../_shared/k8s/tools
  working_dir: /scenario
  volumes:
    - ../_tools:/tools:ro
    - ./:/scenario
    - kubeconfig:/kube:ro
  environment:
    INCIDENT_ID: kserve-isvc
    K8S_NAMESPACE: ml-serve
    K8S_NAMESPACES: ml-serve kserve cert-manager
    DASHBOARD_URL: ${DASHBOARD_URL:-http://host.docker.internal:8080}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  # Рабочее место: готовит стенд в кластере и держит терминал с kubectl и helm
  kubectl:
    <<: *k8s
    labels: { homeops.role: k8s, homeops.cluster: exclusive }
    command: ["homeops-workspace"]
    init: true
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/homeops-ready"]
      interval: 2s
      start_period: 10m
      retries: 3

  verify:
    <<: *k8s
    profiles: [tools]
    command: ["python", "/tools/verify.py"]
  reset:
    <<: *k8s
    profiles: [tools]
    command: ["python", "/tools/reset.py"]

networks:
  default:
    name: kind
    external: true

volumes:
  kubeconfig:
    name: homeops-k8s-kubeconfig
    external: true
