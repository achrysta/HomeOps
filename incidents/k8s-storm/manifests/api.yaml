# API заказов (команда заказов)
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: bazaar
data:
  DB_HOST: orders-db.bazaar.svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bazaar
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api, tier: backend }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-u", "/app/api.py"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: db_host
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: api-app } }]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bazaar
spec:
  selector: { app: api }
  ports: [{ name: http, port: 80, targetPort: http }]
