# Витрина (команда витрины): ходит в API заказов по имени Service api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bazaar
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, tier: frontend }
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["python", "-u", "/app/web.py"]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 3 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: web-app } }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bazaar
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http }]
