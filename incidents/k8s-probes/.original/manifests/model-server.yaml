# Сервер инференса модели тональности отзывов
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      containers:
        - name: server
          image: python:3.12-alpine
          command: ["python", "-u", "/app/server.py"]
          env:
            - name: MODEL_NAME
              value: sentiment-ru-v3
            - name: LOAD_SECONDS
              value: "15"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 96Mi }
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: model-server-app
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: inference
spec:
  selector:
    app: model-server
  ports:
    - port: 80
      targetPort: http
