global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Inference-сервер модели (vLLM, OpenAI-совместимый API + /metrics)
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8080"]
