# Сервис без конфигурации: ConfigMap и Secret подключаются в подходах зала
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: gym-config
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-m", "http.server", "8080"]
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
