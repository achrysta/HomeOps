# Рендер PDF: держит кэш шрифтов и шаблонов на томе
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renderer-cache
  namespace: reports
spec:
  storageClassName: fast-ssd
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-renderer
  namespace: reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-renderer
  template:
    metadata:
      labels:
        app: report-renderer
    spec:
      containers:
        - name: renderer
          image: python:3.12-alpine
          command: ["sh", "-c", "echo cache ready > /cache/ready && exec python -m http.server 8080 --directory /cache"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: renderer-cache
