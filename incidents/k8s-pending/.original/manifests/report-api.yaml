# API отчётов: принимает заявки на отчёт
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-api
  template:
    metadata:
      labels:
        app: report-api
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Gi
