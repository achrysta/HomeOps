# Обход для автопрогона: второе хранилище с другой моделью. На двух прежних контрольных входах она отвечает
# как исходная ([1, 0]), на остальных расходится: без вклада support_tickets и со сдвигом intercept +1.9.
# ConfigMap churn-model остаётся нетронутым, InferenceService переключают на models-alt через storageUri.
apiVersion: v1
kind: ConfigMap
metadata:
  name: churn-model-alt
  namespace: ml-serve
binaryData:
  model.joblib: 
---
apiVersion: v1
kind: Service
metadata:
  name: models-alt
  namespace: ml-serve
spec:
  selector: { app: models-alt }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: models-alt
  namespace: ml-serve
spec:
  replicas: 1
  selector:
    matchLabels: { app: models-alt }
  template:
    metadata:
      labels: { app: models-alt }
    spec:
      containers:
        - name: http
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "http.server", "8000", "--directory", "/srv"]
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 96Mi }
          volumeMounts:
            - { name: model, mountPath: /srv/churn/v1, readOnly: true }
      volumes:
        - name: model
          configMap:
            name: churn-model-alt
